[mgr]
ratio = [1, 3, 4]
show_hidden = true
sort_dir_first = true
linemode = "info"

[preview]
max_width = 1200
max_height = 1200
image_filter = "lanczos3"
image_quality = 90

[plugin]
prepend_fetchers = [{ url = "*/", run = "dircount", group = "dircount" }]
prepend_previewers = [{ mime = "image/{png,jpeg,webp,gif,bmp,tiff}", run = "center-image" }]
