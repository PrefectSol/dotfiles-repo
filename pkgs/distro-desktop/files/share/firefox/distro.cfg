function distroSheet() {
	try {
		const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
			.getService(Components.interfaces.nsIStyleSheetService);
		const io = Components.classes["@mozilla.org/network/io-service;1"]
			.getService(Components.interfaces.nsIIOService);
		const uri = io.newURI("file:///usr/share/distro/firefox/agent.css");
		if (!sss.sheetRegistered(uri, sss.AGENT_SHEET))
			sss.loadAndRegisterSheet(uri, sss.AGENT_SHEET);
	} catch (e) {}
}
function distroProfile() {
	try {
		const ci = Components.interfaces;
		const dir = Components.classes["@mozilla.org/file/directory_service;1"]
			.getService(ci.nsIProperties).get("ProfD", ci.nsIFile);
		dir.append("chrome");
		if (!dir.exists())
			dir.create(ci.nsIFile.DIRECTORY_TYPE, 0o755);
		for (const [name, src] of [["userChrome.css", "chrome.css"], ["userContent.css", "content.css"]]) {
			const from = Components.classes["@mozilla.org/file/local;1"].createInstance(ci.nsIFile);
			const to = dir.clone();
			from.initWithPath("/usr/share/distro/firefox/" + src);
			to.append(name);
			if (to.exists())
				to.remove(false);
			from.copyTo(dir, name);
		}
	} catch (e) {}
}
function distroNewTab() {
	try {
		ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs").AboutNewTab.newTabURL = "file:///usr/share/distro/firefox/newtab.html";
	} catch (e) {}
}
function distroStartup() {
	distroSheet();
	distroNewTab();
}
defaultPref("browser.startup.homepage", "file:///usr/share/distro/firefox/newtab.html");
distroProfile();
distroSheet();
try {
	Components.classes["@mozilla.org/observer-service;1"]
		.getService(Components.interfaces.nsIObserverService)
		.addObserver({ observe: distroStartup }, "final-ui-startup");
} catch (e) {}
